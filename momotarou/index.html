<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momotarou Battle Game</title>
    <meta name="description" content="A simple battle game based on the Momotarou story, where characters are chosen randomly when you push the attack button and engage in battles.">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MOMOTAROU BATTLE GAME">
    <meta property="og:description" content="A simple turn-based battle game based on famous Japanese fairytale Momotarou.">
    <meta property="og:url" content="https://kanna219.github.io/wdd131/momotarou/"> 
    <meta property="og:image" content="images/social-preview.png">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MOMOTAROU BATTLE GAME">
    <meta name="twitter:description" content="A simple turn-based battle game based on famous Japanese fairytale Momotarou.">
    <meta name="twitter:image" content="images/social-preview.png">

    <!-- Favicon & Touch Icon -->
    <link rel="icon" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>
    <header>
        <div class="header-container">
            <img src="images/logo_1.png" alt="Momotarou Battle Game Logo">
            <div class="title">
                <h1>MOMOTAROU</h1>
                <h2>BATTLE GAME</h2>
            </div>
        </div>
    </header>

    <main>
        <div id="game">
            
            <div id="characters">
                <div class="character" id="player-side">
                    <div class="img-wrapper">
                        <img id="player-img" src="images/momoteam_1.png" alt="Momotarou team">
                    </div>
                    <h3 id="player-name">MOMOTAROU</h3>
                    <div class="hp-container">
                        <div class="hp-text">
                            <span>HP</span> 
                            <div><strong id="player-hp-val">50</strong>/50</div>
                        </div>
                        <div class="hp-bar-bg">
                            <div id="player-hp-bar" class="hp-bar"></div>
                        </div>
                    </div>
                </div>

                <div class="vs-divider" aria-hidden="true">VS</div>

                <div class="character" id="enemy-side">
                    <div class="img-wrapper">
                        <img id="enemy-img" src="images/oni_1.png" alt="Oni Boss">
                    </div>
                    <h3>ONI (Monster)</h3>
                    <div class="hp-container">
                        <div class="hp-text">
                            <span>HP</span> 
                            <div><strong id="enemy-hp-val">70</strong>/70</div>
                        </div>
                        <div class="hp-bar-bg">
                            <div id="enemy-hp-bar" class="hp-bar enemy-bar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lower-area">
                <div class="log-section">
                    <p class="log-indicator">— BATTLE LOG —</p>
                    <div id="battleLog">
                        <!-- add log here by js -->
                    </div>
                </div>

                <div class="action-section">
                    <div class="dango-status">
                        <div class="dango-label">
                            DANGO<span id="dango-dots" class="dots" aria-hidden="true">● ● ●</span>
                        </div>
                        <div class="dango-remaining">
                            <span id="dango-count">3</span> remaining
                        </div>
                    </div>

                    <div class="controls">
                        <button id="attack-btn">ATTACK</button>
                        <button id="heal-btn">HEAL</button>
                    </div>
                </div>
            </div> 
            
        </div> 
    </main>
</body>
</html>
