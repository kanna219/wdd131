<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="recipes.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RECIPEBOOK">
    <meta property="og:description" content="Recipe Book - A simple recipe book page with a search box, recipe cards, and social media links.">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="RECIPEBOOK">
    <meta name="twitter:description" content="Recipe Book - A simple recipe book page with a search box, recipe cards, and social media links.">
    <meta name="twitter:image" content="social-preview.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                    
</head>
<body>
    <header>
        <div class="logo-area">
            <img src="images/recipe-book.png" alt="Recipe Book Icon">
            <h1>RECIPEBOOK</h1>
        </div>
    </header>
    <main class="container">
        <div class="search-box">
            <input type="text" placeholder="Find a recipe" id="searchInput">
            <button type="button" class="search-btn">
                <img src="images/search.svg" alt="Search">
            </button>
        </div>
        <hr>
        <div class="recipe-card">
            <div class="recipe-image">
                <img src="images/apple-crisp.jpg" alt="Apple Crisp">
            </div>
            
            <div class="recipe-details">
                <span class="category-tag">dessert</span>
                <h2>Apple Crisp</h2>
                
                <div class="rating-area">
                    <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                </div>
                
                <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
            </div>
        </div>
    </main>
    

    <footer>
                
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                  
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                           
    </footer>
</body>
</html>
